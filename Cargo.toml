[workspace]
resolver = "2"
members = ["crates/script_extender", "crates/injector", "crates/inject_core"]

[workspace.package]
edition = "2021"
version = "0.37.0-beta.1"
publish = false

# Release profile: small stripped DLL, no unwinding across the FFI boundary.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
